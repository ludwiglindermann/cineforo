server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resuelve los nombres de los servicios de docker-compose
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ===== Comunicacion FrontEnd -> BackEnd (dentro de la red de Docker) =====
    location ~ ^/api/(auth|usuarios|roles) {
        set $usuarios http://usuarios-ms:8081;
        proxy_pass $usuarios;
    }
    location ~ ^/api/(categorias|temas|comentarios) {
        set $foro http://foro-ms:8082;
        proxy_pass $foro;
    }
    location ~ ^/api/sanciones {
        set $moderacion http://moderacion-ms:8083;
        proxy_pass $moderacion;
    }

    # Rutas de Angular (/login, /tema/3...): si el archivo no existe, se entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para los archivos con hash (js, css, fuentes)
    location ~* \.(js|css|woff2?|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
