server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de Angular (/login, /tema/3...): si el archivo no existe, se entrega index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache larga para los archivos con hash (js, css, fuentes)
    location ~* \.(js|css|woff2?|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
