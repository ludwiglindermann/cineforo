# =====================================================================
# CineForo - despliegue completo con Docker (Play with Docker o local)
#
# Requisitos en la maquina donde se ejecuta:
#   1. Carpeta ./wallet con el Wallet de Oracle Cloud descomprimido
#   2. Archivo .env con:
#        DB_PASSWORD=tu_clave
#        DOCKERHUB_USER=tu_usuario_de_docker_hub
#
# Construir y levantar:   docker compose up -d --build
# Subir al registry:      docker compose push      (Docker Hub)
# =====================================================================
services:

  usuarios-ms:
    build: ./usuarios-ms
    image: ${DOCKERHUB_USER:-cineforo}/cineforo-usuarios-ms:2.0.0
    ports:
      - "8081:8081"
    environment:
      DB_TNS_NAME: foros_tp
      DB_WALLET_PATH: /app/wallet
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./wallet:/app/wallet:ro
    restart: unless-stopped

  foro-ms:
    build: ./foro-ms
    image: ${DOCKERHUB_USER:-cineforo}/cineforo-foro-ms:2.0.0
    ports:
      - "8082:8082"
    environment:
      DB_TNS_NAME: foros_tp
      DB_WALLET_PATH: /app/wallet
      DB_PASSWORD: ${DB_PASSWORD}
      USUARIOS_SERVICE_URL: http://usuarios-ms:8081
    volumes:
      - ./wallet:/app/wallet:ro
    depends_on:
      - usuarios-ms
    restart: unless-stopped

  moderacion-ms:
    build: ./moderacion-ms
    image: ${DOCKERHUB_USER:-cineforo}/cineforo-moderacion-ms:1.0.0
    ports:
      - "8083:8083"
    environment:
      DB_TNS_NAME: foros_tp
      DB_WALLET_PATH: /app/wallet
      DB_PASSWORD: ${DB_PASSWORD}
      USUARIOS_SERVICE_URL: http://usuarios-ms:8081
      FORO_SERVICE_URL: http://foro-ms:8082
    volumes:
      - ./wallet:/app/wallet:ro
    depends_on:
      - usuarios-ms
      - foro-ms
    restart: unless-stopped

  cineforo-web:
    build: ./cineforo-web
    image: ${DOCKERHUB_USER:-cineforo}/cineforo-web:1.0.0
    ports:
      - "4200:80"
    restart: unless-stopped
