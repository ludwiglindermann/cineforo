spring.application.name=foro-ms
server.port=8082

# URL del microservicio de Usuarios (en Docker la define la variable USUARIOS_SERVICE_URL)
usuarios.service.url=http://localhost:8081

# ===================== Conexion a Oracle Cloud =====================
# DB_TNS_NAME, DB_WALLET_PATH y DB_PASSWORD se leen desde db-local.properties
# (archivo local, excluido de Git). Plantilla: db-local.properties.example
spring.config.import=optional:file:./db-local.properties,optional:file:../db-local.properties

spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_NAME}
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${DB_WALLET_PATH}
spring.datasource.username=FORO_MS
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================== JPA ================================
# Las tablas se crean con los scripts SQL del proyecto
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ============================ Logging ==============================
logging.level.root=INFO
logging.level.cl.duoc.cineforo.foro=DEBUG
logging.level.org.hibernate.SQL=DEBUG
