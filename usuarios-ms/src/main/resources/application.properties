spring.application.name=usuarios-ms
server.port=8081

# ===================== Conexion a Oracle Cloud =====================
# DB_TNS_NAME, DB_WALLET_PATH y DB_PASSWORD se leen desde
# db-local.properties (en la carpeta raiz "cineforo"). Ese archivo NO se sube a Git.
spring.config.import=optional:file:./db-local.properties,optional:file:../db-local.properties

spring.datasource.url=jdbc:oracle:thin:@${DB_TNS_NAME}
# Ruta del Wallet como propiedad aparte (funciona aunque la ruta tenga espacios)
spring.datasource.hikari.data-source-properties.oracle.net.tns_admin=${DB_WALLET_PATH}
spring.datasource.username=USUARIOS_MS
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================== JPA ================================
# Las tablas se crean con scripts/01_usuarios_ms.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ============================ Logging ==============================
logging.level.root=INFO
logging.level.cl.duoc.cineforo=DEBUG
# Muestra en consola las consultas SQL que se envian a Oracle
logging.level.org.hibernate.SQL=DEBUG
